<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070a" />
    <meta name="description" content="Der Berliner Nahverkehr in Echtzeit als Nebelkammer." />
    <meta name="referrer" content="no-referrer" />
    <title>Nebelkammer Berlin</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305070a'/%3E%3Cpath d='M4 26 C 12 18, 18 14, 28 6' stroke='%2396d4ff' stroke-width='1.6' fill='none' stroke-dasharray='1.2 1.4'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23f0f6ff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="chamber" aria-label="Nebelkammer-Visualisierung der Fahrzeuge in der Umgebung" role="img"></canvas>

    <aside id="legend" class="panel" aria-label="Legende">
      <h1>Nebelkammer · Berlin</h1>
      <ul></ul>
      <p class="hint">Helle Flecken: stehende Fahrzeuge</p>
    </aside>

    <div id="notice" class="panel" role="status" hidden></div>

    <div id="tip" class="panel" role="tooltip" hidden>
      <div class="tip-head"><span class="tip-dot"></span><span class="tip-title"></span></div>
      <div class="tip-sub"></div>
    </div>

    <footer>
      <div id="status" role="status" aria-live="polite"></div>
      <div id="attribution"></div>
    </footer>

    <div id="controls" class="panel">
      <div class="sliders">
        <label class="ctl" title="Abfrageradius um deine Position">
          <span class="label">Radius</span>
          <input id="radius" type="range" aria-label="Radius in Kilometern" />
          <span id="radius-value" class="value"></span>
          <span aria-hidden="true"></span>
        </label>
        <div class="ctl">
          <label class="ctl-inner" title="Nachleuchtdauer der Spuren">
            <span class="label">Nachleuchten</span>
            <input id="persist" type="range" aria-label="Nachleuchtdauer in Minuten" />
            <span id="persist-value" class="value"></span>
          </label>
          <label class="infinite" title="Spuren nie ausblenden">
            <input id="persist-infinite" type="checkbox" />
            <span>unendlich</span>
          </label>
        </div>
      </div>
      <div class="buttons">
        <button id="pause" type="button" title="Pause" aria-pressed="false">❚❚</button>
        <button id="legend-toggle" type="button" title="Legende ein/aus" aria-pressed="true">i</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
